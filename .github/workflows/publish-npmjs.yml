name: Publish Zoneflow Packages

on:
  # 태그 드리븐(정식 배포): vX.Y.Z 태그 push → npm publish + GitHub Release.
  push:
    tags:
      - "v*.*.*"
  # 수동 실행(검증/임시 배포): 기본 dry-run, git 태그 기준 자동 증가.
  workflow_dispatch:
    inputs:
      dist_tag:
        description: 배포할 npm dist-tag (수동 실행 전용)
        required: false
        default: latest
        type: string
      access:
        description: npm 접근 수준
        required: false
        default: public
        type: choice
        options:
          - restricted
          - public
      dry_run:
        description: 실제 배포 없이 검증만 실행
        required: false
        default: true
        type: boolean
      release_type:
        description: 자동 버전 증가 방식
        required: false
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
          - prerelease
      release_version:
        description: 직접 지정할 배포 버전. 비우면 git 태그 기준 자동 증가
        required: false
        default: ""
        type: string
      prerelease_id:
        description: prerelease 선택 시 사용할 식별자
        required: false
        default: rc
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-npmjs
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
          scope: "@zoneflow"

      - name: Ensure supported npm version
        run: npm install -g npm@^11.5.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve release version
        id: release-version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            # 태그 드리븐: 버전은 태그(vX.Y.Z)에서 그대로 가져온다.
            version="${GITHUB_REF_NAME#v}"
            case "$version" in
              *-*) dist_tag="next" ;;
              *)   dist_tag="latest" ;;
            esac
            access="public"
            dry_run="false"
          else
            # 수동 실행: git 태그 기준 자동 증가(또는 직접 지정).
            version_args=(
              --source git
              --bump "${{ inputs.release_type }}"
              --prerelease-id "${{ inputs.prerelease_id }}"
            )
            if [ -n "${{ inputs.release_version }}" ]; then
              version_args+=(--version "${{ inputs.release_version }}")
            fi
            version=$(node ./scripts/release-version.mjs "${version_args[@]}")
            dist_tag="${{ inputs.dist_tag }}"
            access="${{ inputs.access }}"
            dry_run="${{ inputs.dry_run }}"
          fi

          # 모든 package.json(루트+packages)을 배포 버전으로 기록(pack 이 이 값을 씀).
          node ./scripts/release-version.mjs --write --version "$version" >/dev/null

          {
            echo "version=${version}"
            echo "dist_tag=${dist_tag}"
            echo "access=${access}"
            echo "dry_run=${dry_run}"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved: version=${version} dist_tag=${dist_tag} access=${access} dry_run=${dry_run}"

      - name: Build packages
        run: pnpm -r --filter "./packages/*" build

      - name: Type check
        run: pnpm -r --filter "./packages/*" type-check

      - name: Pack packages
        run: |
          rm -rf .npm-packages
          mkdir -p .npm-packages
          pnpm -r --filter "./packages/*" pack --pack-destination ./.npm-packages
          ls -1 .npm-packages

      - name: Publish packages
        run: |
          echo "Publishing ${{ steps.release-version.outputs.version }} (dist-tag: ${{ steps.release-version.outputs.dist_tag }}, dry-run: ${{ steps.release-version.outputs.dry_run }})"
          shopt -s nullglob
          tarballs=(./.npm-packages/*.tgz)

          if [ ${#tarballs[@]} -eq 0 ]; then
            echo "No package tarballs were produced."
            exit 1
          fi

          for tarball in "${tarballs[@]}"; do
            if [ "${{ steps.release-version.outputs.dry_run }}" = "true" ]; then
              npm publish "$tarball" \
                --dry-run \
                --access "${{ steps.release-version.outputs.access }}" \
                --tag "${{ steps.release-version.outputs.dist_tag }}"
            else
              npm publish "$tarball" \
                --access "${{ steps.release-version.outputs.access }}" \
                --tag "${{ steps.release-version.outputs.dist_tag }}"
            fi
          done

      - name: Create GitHub Release
        if: ${{ github.event_name == 'push' && steps.release-version.outputs.dry_run == 'false' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prerelease_flag=""
          case "${{ steps.release-version.outputs.version }}" in
            *-*) prerelease_flag="--prerelease" ;;
          esac
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag \
            $prerelease_flag
